<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ComicCraft{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">ComicCraft</a>
    <span class="tag">AI comic story creator</span>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">Powered by Gemini &amp; Stable Diffusion</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
